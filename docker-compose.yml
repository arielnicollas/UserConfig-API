version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: store_db
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
  backend:
    build: ./backend
    ports:
      - '3000:3000'
    depends_on:
      - mysql
    environment:
      - DATABASE_HOST=mysql


volumes:
  mysql-data: